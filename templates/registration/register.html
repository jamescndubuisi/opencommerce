{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
{{ title }}
{% endblock title %}

{% block config %}
<style>
  .auth-card { max-width: 640px; margin: 32px auto; padding: 28px; border-radius: 12px; }
  .auth-card .form-control { border-radius: 8px; }
</style>
{% endblock %}


{% block nav %}
    <ul class="navbar-nav mr-auto">



    </ul>
    <ul class="navbar-nav my-2 my-lg-0">
        <li class="nav-item">
            <a class="nav-link" href="{% url 'log_in' %}">Login</a>
        </li>
    </ul>

{% endblock %}
{{% block content %}
<div class="card card-soft auth-card">
  <div class="card-body">
    <h3 class="text-center">{{ title }}</h3>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="text-center mt-3">
        <button type="submit" class="btn btn-success btn-pill">Create account</button>
      </div>
    </form>
    <p class="mt-3 text-center small">Already registered? <a href="{% url 'log_in' %}">Login</a></p>
  </div>
</div>
{% endblock %}
